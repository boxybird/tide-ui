<article class="tide-event-card{{IN_VIEW_CLASS}}" aria-labelledby="card-{{ID}}"{{VENUE_ATTRIBUTE}} data-date="{{DATE}}"{{END_DATE_ATTRIBUTE}} data-category="{{CATEGORY}}" data-search="{{SEARCH}}">
      <a class="tide-event-card__link" href="{{ID}}.html" aria-label="View {{TITLE}}"></a>
      <div class="tide-event-card__content"><div class="tide-event-card__copy">
        <div class="tide-event-card__heading"><span class="tide-event-card__category">{{CATEGORY_LABEL}}</span><span class="tide-badge tide-event-card__status"{{STATUS_HIDDEN}}>In view</span></div>
        <h4 class="tide-event-card__title" id="card-{{ID}}">{{TITLE}}</h4>
        <p class="tide-event-card__venue">{{VENUE_LABEL}}</p>
      </div>
      <div class="tide-event-card__meta"><time class="tide-date" datetime="{{DATE}}" aria-label="{{DATE_LABEL}}"><span class="tide-date__day" aria-hidden="true">{{DAY}}</span><span class="tide-date__parts" aria-hidden="true"><span>{{WEEKDAY}}</span><span>{{MONTH}}</span></span></time><{{TIME_TAG}}{{TIME_ATTRIBUTE}}>{{TIME}}</{{TIME_TAG}}><span class="tide-event-card__price">{{PRICE}}</span></div></div>
    </article>
