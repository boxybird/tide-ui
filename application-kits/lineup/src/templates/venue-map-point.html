<div class="tide-venue__point tide-venue__point--{{VENUE_ID}}" id="map-{{VENUE_ID}}" tabindex="-1">
  <span class="tide-venue-map__split"><a class="tide-photo-control" href="#venue-{{VENUE_ID}}" aria-label="Show {{VENUE_NAME}} in venue list">{{> venue-icon-square}}<span class="tide-venue__label tide-venue__label--rest" aria-hidden="true">{{VENUE_NAME}}</span><span class="tide-venue__state" data-select="{{VENUE_ID}}"><span class="tide-venue__label" aria-hidden="true"><span class="tide-venue__map-name">{{VENUE_NAME}}</span><br><span>Selected</span></span></span></a></span>
  <span class="tide-venue-map__compact"><button class="tide-photo-control" type="button" popovertarget="map-panel-{{VENUE_ID}}" aria-label="Preview {{VENUE_NAME}}">{{> venue-icon-square}}</button></span>
  {{> venue-map-panel}}
</div>
