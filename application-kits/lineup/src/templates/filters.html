<div class="tide-stack tide-app__filters">
    <fieldset class="tide-fieldset tide-stack"><legend class="tide-fieldset__legend">When</legend><p class="tide-field__hint" id="date-hint">Choose a start and end date.</p>
      <div class="tide-app__date-fields"><div class="tide-field"><label class="tide-field__label" for="event-from">From</label><input class="tide-field__control" id="event-from" type="date" name="from" form="event-search-form" aria-describedby="date-hint"></div><div class="tide-field"><label class="tide-field__label" for="event-to">Through</label><input class="tide-field__control" id="event-to" type="date" name="to" form="event-search-form" aria-describedby="date-hint"></div></div>
    </fieldset>
    <fieldset class="tide-fieldset"><legend class="tide-fieldset__legend">Category</legend><label class="tide-choice"><input type="checkbox" name="category" value="music" form="event-search-form"{{MUSIC_CHECKED}}> Music</label><label class="tide-choice"><input type="checkbox" name="category" value="comedy" form="event-search-form"{{COMEDY_CHECKED}}> Comedy</label><label class="tide-choice"><input type="checkbox" name="category" value="workshop" form="event-search-form"{{WORKSHOP_CHECKED}}> Workshops</label></fieldset>
</div>
