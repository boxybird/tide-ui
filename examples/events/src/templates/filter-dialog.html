<dialog class="tide-filter-panel tide-filter-drawer__dialog" id="responsive-filters" aria-labelledby="responsive-filter-title">
<header class="tide-filter-panel__header">
<h2 class="tide-filter-panel__title" id="responsive-filter-title" tabindex="-1">Search &amp; filters</h2>
<button class="tide-button tide-button--quiet tide-button--icon" type="button" aria-label="Cancel search and filter changes" data-filter-close><svg class="tide-icon" viewBox="0 0 15 15" fill="none" aria-hidden="true" focusable="false"><path d="m4 4 7 7M11 4l-7 7" stroke="currentColor" stroke-linecap="round" stroke-width="1.25"/></svg></button>
<p class="tide-filter-panel__description">Find an event or narrow the lineup. Changes apply together.</p></header>
<div class="tide-filter-panel__body"></div>
<footer class="tide-filter-panel__footer">
  <div class="tide-filter-panel__status-row">
    <button class="tide-button tide-button--quiet" type="button" data-filter-reset disabled>Reset all</button>
    <p class="tide-filter-panel__count" role="status" aria-live="polite" aria-atomic="true"></p>
  </div>

</footer>
</dialog>
