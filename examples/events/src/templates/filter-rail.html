<aside class="tide-app__filter-rail tide-filter-panel tide-filter-panel--rail" id="lineup-filters" popover="auto" aria-label="Search and filters" tabindex="0">
  <header class="tide-filter-panel__header tide-app__filter-header">
    <h2 class="tide-filter-panel__title" id="filter-title">Search &amp; filters</h2>
    <button class="tide-button tide-button--quiet tide-button--icon" type="button" popovertarget="lineup-filters" popovertargetaction="hide" aria-label="Close filters" autofocus><svg class="tide-icon" viewBox="0 0 15 15" fill="none" aria-hidden="true" focusable="false"><path d="m4 4 7 7M11 4l-7 7" stroke="currentColor" stroke-linecap="round" stroke-width="1.25"/></svg></button>
  </header>
  <div class="tide-filter-panel__body tide-app__filter-body" tabindex="0" role="region" aria-label="Filter options">{{> results-intro}}{{> filters}}</div>
  <div class="tide-filter-panel__footer tide-app__filter-footer">{{> filter-status}}{{> filter-actions}}</div>
</aside>
