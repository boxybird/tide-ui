<article class="tide-event-card{{CARD_MODIFIER}}" id="{{CARD_ID}}" aria-labelledby="{{CARD_ID}}-title" data-listing-card="{{CARD_CASE}}"{{CARD_HIDDEN}}>
{{CARD_LINK}}<div class="tide-event-card__content"><div class="tide-event-card__copy"><div class="tide-event-card__heading"><span class="tide-event-card__category">{{CARD_CATEGORY}}</span>{{CARD_STATUS}}{{CARD_ACTION}}</div>
<h{{CARD_LEVEL}} class="tide-event-card__title" id="{{CARD_ID}}-title">{{CARD_TITLE}}</h{{CARD_LEVEL}}><p class="tide-event-card__venue">{{CARD_VENUE}}</p></div>
<div class="tide-event-card__meta">{{CARD_DATE}}{{CARD_TIME}}<span class="tide-event-card__price">{{CARD_PRICE}}</span></div></div></article>
