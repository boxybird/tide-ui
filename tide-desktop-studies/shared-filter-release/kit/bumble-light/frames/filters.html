<p class="tide-eyebrow">Discover</p>
<h1 class="tide-page-intro__title">Make it your evening.</h1>
<p>A few choices to narrow things down.</p>
</div>
<form action="search.html" class="tide-page-body">
<fieldset class="tide-fieldset tide-form-section">
<legend class="tide-fieldset__legend">When</legend>
<div class="tide-chip-list"><label class="tide-chip"><input type="radio" name="when" value="today">Today</label><label class="tide-chip"><input type="radio" name="when" value="tomorrow">Tomorrow</label><label class="tide-chip"><input type="radio" name="when" value="weekend" checked>This weekend</label><label class="tide-chip"><input type="radio" name="when" value="any">Any time</label>
</div>
<p class="tide-caption">Friday, October 23 – Saturday, October 24</p>
</fieldset>
<fieldset class="tide-fieldset tide-form-section">
<legend class="tide-fieldset__legend">What are you into?</legend><label class="tide-choice"><input type="checkbox">Music</label><label class="tide-choice"><input type="checkbox">Comedy</label><label class="tide-choice"><input type="checkbox">Workshops</label><label class="tide-choice"><input type="checkbox">Art &amp; culture</label><label class="tide-choice"><input type="checkbox">Food &amp; drink</label>
</fieldset>
<fieldset class="tide-fieldset tide-form-section">
<legend class="tide-fieldset__legend">Price</legend><label class="tide-choice"><input type="radio" name="price" checked>Any price</label><label class="tide-choice"><input type="radio" name="price">Free events only</label>
</fieldset>
<div class="tide-form-actions"><button class="tide-button tide-button--full">Show matching events</button><button class="tide-button tide-button--quiet tide-button--full" type="reset">Reset choices</button><a class="tide-button tide-button--secondary tide-button--full" href="search.html">Cancel</a>
